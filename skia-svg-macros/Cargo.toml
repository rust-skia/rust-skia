[package]
name = "skia-svg-macros"

description = "Skia SVG Macros for Dom bindings"
# This crate is versioned on its own, independent of the Skia milestone. Any change to the
# crate, the metadata in this file included, bumps the version here and in the
# `skia-svg-macros` dependency of `skia-safe/Cargo.toml`. A compatible change bumps the
# patch version, and a breaking change bumps the minor version. `just release-verify` fails
# when the crate changed since the previous release tag but kept that tag's version.
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true

repository = "https://github.com/rust-skia/rust-skia"
documentation = "https://docs.rs/skia-svg-macros"
license = "MIT"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.87"
quote = "1.0.37"
syn = { version = "3.0.3", features = ["full"] }
