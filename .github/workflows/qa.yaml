name: 'qa'
on:
  push:
  pull_request:
  # The nightly run catches vulnerabilities that are published after a change was merged.
  schedule:
    - cron: '0 0 * * *'

jobs:
  qa:
    runs-on: ubuntu-24.04
    container: ghcr.io/pragmatrix/rust-skia-linux:latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
    - name: Fetch Skia submodule tags
      run: |
        git -C skia-bindings/skia fetch --tags --force
    - name: Check Skia metadata
      run: |
        just check-skia-submodule-tag
    - name: Install Rust
      run: |
        rustup update stable
        rustup default stable 
        rustup component add rustfmt
    - run: |
        cargo fmt -- --check
    # The platform workflows are generated, so a hand edit or a generator change committed without
    # regenerating would otherwise go unnoticed.
    #
    # The workspace directory belongs to the runner user, but the container runs as root. Git
    # therefore treats the repository as unsafe and does not recognize it until it is marked safe.
    - name: Check generated workflows
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        just workflows
        git diff --exit-code -- .github/workflows

  audit:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
    - name: Install just
      uses: extractions/setup-just@v2
    - name: Check the Skia DEPS pins for known vulnerabilities
      run: |
        just audit-skia-deps
    - name: Check the Cargo dependencies for security advisories
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check advisories
