runs-on: windows-11-arm
# Containers are not supported on Windows.
# container: ghcr.io/pragmatrix/rust-skia-windows:latest
env:
  SKIA_DEBUG: $[[skiaDebug]]

steps:
- uses: actions/checkout@v3
  with:
    submodules: true

- name: Install Rust
  uses: dtolnay/rust-toolchain@$[[rustToolchain]]

- name: Install Clippy
  run: rustup component add clippy
  shell: bash

- name: Python Version
  run: python --version

- name: Install LLVM and Clang
  uses: KyleMayes/install-llvm-action@v2
  with:
    version: "22.1.8"
    # The action's list of known versions ends at 21.1.8, so the installer URL is given directly.
    force-url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-woa64.exe"

- name: Install Ninja
  run: choco install ninja
