[package]
name = "wasm-wgpu-example"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
skia-safe = { path = "../skia-safe", features = ["wgpu"] }
skia-icon = { path = "../skia-icon" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Performance"] }
console_error_panic_hook = "0.1"
